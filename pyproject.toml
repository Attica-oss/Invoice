[project]
name = "invoice"
version = "0.1.0"
description = "Invoicing Module"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anywidget>=0.10.0",
    "duckdb>=1.5.0",
    "fastexcel>=0.19.0",
    "marimo>=0.20.4",
    "openpyxl>=3.1.5",
    "polars>=1.38.1",
    "polars-result>=0.2.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "pyzmq>=27.1.0",
    "ruff>=0.15.22",
    "scan-google-sheet>=0.3.0,<0.4",
    "sqlglot>=29.0.1",
    "tabulate>=0.10.0",
    "traitlets>=5.14.3",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
invoice = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.2",
    "ty>=0.0.10",
]

[tool.ruff]
# Generated marimo notebooks are not hand-maintained; linting them is noise
# (useless-expression, unused-locals, naive datetime, ...).
extend-exclude = ["notebooks", "**/__marimo__/**"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings unrelated to the change that introduced this config.
# Listed so `ruff check` can gate CI from a green baseline; drop each as it
# is fixed.
"dataframe/pre_trip_inspection.py" = ["F821"]  # `cleaning_price` undefined; module not wired into dataframe/__init__ yet
"dataframe/shore_handling.py" = ["PLE0604"]    # __all__ = [*_EXPORTS, ...]; dict-unpack is str-only, ruff can't prove it
"dataframe/stuffing.py" = ["PLE0604"]          # same __all__ = [*_EXPORTS, ...] pattern
"datasets/__init__.py" = ["RUF022"]            # __all__ not alphabetically sorted

[tool.ty.src]
# Notebooks are marimo-generated; tests carry deliberate negative cases
# (e.g. passing None to a str param) and rely on union-typed frame helpers.
exclude = ["tests", "notebooks", "**/__marimo__/**"]

[tool.pytest.ini_options]
# Run from the repo root so `import type_casting` / `import save` resolve
# without an installed package. `testpaths` keeps collection off the
# marimo notebooks in notebooks/.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.marimo.runtime]
# Notebooks live in notebooks/, one level below the repo root where the
# dataframe/, datasets/, data_source/, etc. packages sit. marimo puts the
# notebook file's own directory on sys.path (not the repo root), so
# without this, `from dataframe import ...` fails as ModuleNotFoundError
# for any notebook not sitting directly in the repo root. Resolved
# relative to this pyproject.toml's directory.
pythonpath = ["."]
