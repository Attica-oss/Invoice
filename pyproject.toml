[project]
name = "invoice"
version = "0.1.0"
description = "Invoicing Module"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anywidget>=0.10.0",
    "duckdb>=1.5.0",
    "fastexcel>=0.19.0",
    "marimo>=0.20.4",
    "openpyxl>=3.1.5",
    "polars>=1.38.1",
    "polars-result>=0.2.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "pyzmq>=27.1.0",
    "ruff>=0.15.22",
    "scan-google-sheet>=0.3.0,<0.4",
    "sqlglot>=29.0.1",
    "tabulate>=0.10.0",
    "traitlets>=5.14.3",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
invoice = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.10",
]

[tool.marimo.runtime]
# Notebooks live in notebooks/, one level below the repo root where the
# dataframe/, datasets/, data_source/, etc. packages sit. marimo puts the
# notebook file's own directory on sys.path (not the repo root), so
# without this, `from dataframe import ...` fails as ModuleNotFoundError
# for any notebook not sitting directly in the repo root. Resolved
# relative to this pyproject.toml's directory.
pythonpath = ["."]
